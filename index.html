<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Temple Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1209; overflow: hidden; font-family: sans-serif; touch-action: none; }
  canvas { display: block; margin: 0 auto; background: #2d1d0e; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize() {
  canvas.height = window.innerHeight;
  canvas.width = Math.min(window.innerWidth, canvas.height * 0.6);
}
resize();
window.addEventListener('resize', resize);

const LANES = 3;
let state, player, obstacles, coins, score, coinCount, speed, spawnTimer, frame = 0, best = 0;

function reset() {
  player = { lane: 1, x: 1, y: 0, vy: 0, sliding: 0 };
  obstacles = []; coins = [];
  score = 0; coinCount = 0; speed = 6; spawnTimer = 0;
  state = 'playing';
}
reset(); state = 'start';

function laneX(l) { return canvas.width * (0.2 + 0.3 * l); }

function moveLeft() { if (state === 'playing' && player.lane > 0) player.lane--; }
function moveRight() { if (state === 'playing' && player.lane < LANES - 1) player.lane++; }
function jump() { if (state === 'playing' && player.y === 0) player.vy = 16; }
function slide() { if (state === 'playing' && player.y === 0) player.sliding = 30; }
function startOrRestart() { if (state !== 'playing') reset(); }

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') moveLeft();
  else if (e.key === 'ArrowRight') moveRight();
  else if (e.key === 'ArrowUp' || e.key === ' ') { startOrRestart(); jump(); }
  else if (e.key === 'ArrowDown') slide();
});

let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; startOrRestart(); });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 30) moveRight(); else if (dx < -30) moveLeft();
  } else {
    if (dy < -30) jump(); else if (dy > 30) slide();
  }
});

function spawn() {
  const lane = Math.floor(Math.random() * LANES);
  const r = Math.random();
  if (r < 0.45) obstacles.push({ lane, y: -60, type: 'rock' });
  else if (r < 0.65) obstacles.push({ lane, y: -60, type: 'beam' });
  else for (let i = 0; i < 4; i++) coins.push({ lane, y: -60 - i * 50 });
}

function update() {
  frame++;
  if (state !== 'playing') return;
  speed += 0.003;
  score += speed * 0.05;
  spawnTimer++;
  if (spawnTimer > Math.max(25, 60 - speed * 2)) { spawn(); spawnTimer = 0; }

  player.x += (player.lane - player.x) * 0.25;
  if (player.y > 0 || player.vy > 0) {
    player.y += player.vy; player.vy -= 0.9;
    if (player.y <= 0) { player.y = 0; player.vy = 0; }
  }
  if (player.sliding > 0) player.sliding--;

  const py = canvas.height * 0.78;
  obstacles.forEach(o => o.y += speed);
  coins.forEach(c => c.y += speed);

  for (const o of obstacles) {
    if (o.lane === player.lane && Math.abs(o.y - py) < 30) {
      if (o.type === 'rock' && player.y < 30) state = 'over';
      if (o.type === 'beam' && player.sliding === 0) state = 'over';
    }
  }
  coins = coins.filter(c => {
    if (c.lane === player.lane && Math.abs(c.y - py) < 30 && player.y < 40) { coinCount++; return false; }
    return c.y < canvas.height + 50;
  });
  obstacles = obstacles.filter(o => o.y < canvas.height + 50);
  if (state === 'over') best = Math.max(best, Math.floor(score));
}

function limb(x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawCharacter(cx, baseY) {
  // cx = center x, baseY = feet level
  const running = state === 'playing' && player.y === 0 && player.sliding === 0;
  const swing = running ? Math.sin(frame * 0.4) * 14 : 0;
  const airborne = player.y > 0;
  const sliding = player.sliding > 0;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(cx, baseY + 4, 20 - Math.min(player.y / 6, 10), 6, 0, 0, Math.PI * 2); ctx.fill();

  const y = baseY - player.y;

  if (sliding) {
    // lying low on the ground
    limb(cx - 22, y - 12, cx + 14, y - 12, '#2b5fa8', 12);   // body
    limb(cx + 14, y - 12, cx + 30, y - 6, '#2b5fa8', 8);       // legs forward
    ctx.fillStyle = '#f2c28b';
    ctx.beginPath(); ctx.arc(cx - 28, y - 16, 10, 0, Math.PI * 2); ctx.fill(); // head
    ctx.fillStyle = '#4a2c0a';
    ctx.beginPath(); ctx.arc(cx - 30, y - 20, 10, Math.PI, Math.PI * 2); ctx.fill(); // hair
    return;
  }

  const hip = y - 28;
  const shoulder = y - 54;

  // legs
  if (airborne) {
    limb(cx, hip, cx - 12, y - 8, '#3b2a6b', 7);
    limb(cx, hip, cx + 12, y - 14, '#3b2a6b', 7);
  } else {
    limb(cx, hip, cx - swing, y, '#3b2a6b', 7);
    limb(cx, hip, cx + swing, y, '#3b2a6b', 7);
  }
  // arms
  if (airborne) {
    limb(cx, shoulder + 4, cx - 18, shoulder - 14, '#f2c28b', 6);
    limb(cx, shoulder + 4, cx + 18, shoulder - 14, '#f2c28b', 6);
  } else {
    limb(cx, shoulder + 4, cx + swing, shoulder + 24, '#f2c28b', 6);
    limb(cx, shoulder + 4, cx - swing, shoulder + 24, '#f2c28b', 6);
  }
  // body / shirt
  limb(cx, hip, cx, shoulder, '#d9442b', 16);
  // head
  ctx.fillStyle = '#f2c28b';
  ctx.beginPath(); ctx.arc(cx, shoulder - 12, 11, 0, Math.PI * 2); ctx.fill();
  // hair / cap
  ctx.fillStyle = '#4a2c0a';
  ctx.beginPath(); ctx.arc(cx, shoulder - 14, 11, Math.PI, Math.PI * 2); ctx.fill();
  // eye
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx + 4, shoulder - 12, 1.8, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#3a2814';
  ctx.fillRect(canvas.width * 0.05, 0, canvas.width * 0.9, canvas.height);
  ctx.strokeStyle = '#6b4a24'; ctx.lineWidth = 2;
  for (let l = 1; l < LANES; l++) {
    const x = canvas.width * (0.05 + 0.3 * l);
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  const py = canvas.height * 0.78;

  obstacles.forEach(o => {
    const x = laneX(o.lane);
    if (o.type === 'rock') { ctx.fillStyle = '#777'; ctx.fillRect(x - 28, o.y - 25, 56, 50); }
    else { ctx.fillStyle = '#a0522d'; ctx.fillRect(x - 40, o.y - 50, 80, 20); }
  });
  ctx.fillStyle = '#ffd700';
  coins.forEach(c => { ctx.beginPath(); ctx.arc(laneX(c.lane), c.y, 10, 0, Math.PI * 2); ctx.fill(); });

  const px = laneX(0) + (laneX(1) - laneX(0)) * player.x;
  drawCharacter(px, py);

  ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Score: ' + Math.floor(score), 15, 30);
  ctx.fillText('Coins: ' + coinCount, 15, 58);
  ctx.textAlign = 'right'; ctx.fillText('Best: ' + best, canvas.width - 15, 30);

  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '32px sans-serif';
    ctx.fillText(state === 'start' ? 'Temple Run' : 'Game Over', canvas.width / 2, canvas.height / 2 - 20);
    ctx.font = '18px sans-serif';
    ctx.fillText('Tap or press Space to play', canvas.width / 2, canvas.height / 2 + 20);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
